# Runs on every push and pull request: server tests, type checks, the web build and the style rules.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: pip install -r requirements.txt pytest
      - run: npm ci
      - run: scripts/check
