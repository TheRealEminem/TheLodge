# Makes the newest beta the release everyone gets, once it's been tried: every day, scripts/promote-beta.sh looks
# at the newest pre-release in app.json's "updateRepo", and once it's been out 3 days with no open issue labelled
# "blocks release", promotes it. Otherwise it logs why not. With no updateRepo (updates off), it does nothing.
#   Actions tab -> "Promote beta" -> Run   -> checks now (tick "dry run" to only see what it would do, or name a
#                                             pre-release to promote it however long it's been out)
name: Promote beta

on:
  schedule:
    - cron: "0 16 * * *"   # daily, 16:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only say what it would do"
        type: boolean
        default: false
      tag:
        description: "Promote this pre-release now (v0.3.0), however long it's been out"
        type: string
        default: ""

permissions:
  contents: write   # to edit the release
  issues: read      # to look for blocking issues

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Promote the newest beta if it's ready
        env:
          # A repo other than this one needs a token that can write to it (the same RELEASE_TOKEN as release.yml).
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TAG: ${{ inputs.tag }}
        run: scripts/promote-beta.sh ${TAG:+"$TAG"}
