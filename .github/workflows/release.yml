# Builds the Mac app on GitHub, tries its updater, and publishes it as a *pre-release* (a beta) to app.json's
# "updateRepo", the repo installed apps look in.
#   bump VERSION and commit, then: git tag v0.2.0 && git push origin v0.2.0
#       -> builds, runs scripts/smoke-test.sh, publishes <Name>-0.2.0-arm64.dmg (+ .sha256, and <Name>-arm64.dmg for
#          a download page; spaces left out of the names) as a pre-release
#   Actions tab -> "Build Mac app" -> Run   -> builds and tests it, keeps it as a downloadable artifact only
#     ... on main, with "Release it" ticked -> tags main as v<VERSION> and publishes it, as a pushed tag would
#     ... and "To everyone" ticked too      -> also promotes it right away (scripts/promote-beta.sh), skipping the beta days
# No terminal needed: the Run button works from the GitHub website or app. Releasing stays a person's call;
# automation (Claude Code sessions included) shouldn't press it on its own.
#
# A pre-release reaches only the people with "Beta updates" on. promote.yml makes it the release everyone gets
# after a few days, unless an open issue is labelled "blocks release". With no updateRepo in app.json, updates are
# off and nothing is published. To publish to a repo other than this one (a public one, for a private app's
# code), put a token that can write to it in the RELEASE_TOKEN secret.
# Mac builders cost ten times the Linux ones: day to day, build and install on this Mac with scripts/install-app.sh.
name: Build Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release it: tag main as v<VERSION> and publish it as a beta (unticked: a test build only)"
        type: boolean
        default: false
      everyone:
        description: "To everyone: promote it right away instead of after 3 days as a beta (needs Release it)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15   # Apple silicon. Its Swift is older than a current Mac's: see ARCHITECTURE.md, "Gotchas".
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Read app.json
        id: app
        run: |
          echo "name=$(jq -r .name app.json)" >>"$GITHUB_OUTPUT"
          echo "repo=$(jq -r '.updateRepo // ""' app.json)" >>"$GITHUB_OUTPUT"
      # The release this run makes, if any: the pushed tag, or v<VERSION> when run with "Release it". Checked before
      # the build, so a version that's already out (VERSION not bumped) stops here rather than after it.
      - name: Which version this releases
        id: release
        env:
          RELEASE: ${{ inputs.release && '1' || '0' }}
        run: |
          tag=""
          version="$(tr -d '[:space:]' <VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::The tag is $tag but VERSION says $version. Bump VERSION, commit, and tag that commit."; exit 1
            fi
          elif [[ "$RELEASE" == 1 ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Releases are made from main, not $GITHUB_REF_NAME"; exit 1; }
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag is already out. Bump VERSION first."; exit 1
            fi
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "${tag:-A test build: nothing is published}"
      - name: Build the app and the disk image
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # A test build gets a version newer than the release, so there is something to update to.
          if [[ -z "$TAG" ]]; then export VERSION="$(tr -d '[:space:]' <VERSION).$GITHUB_RUN_NUMBER"; fi
          scripts/build-app.sh --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: mac-app
          path: |
            dist-app/*.dmg
            dist-app/*.sha256
      - name: "Smoke test: updating, going back, beta updates, busy and skip"
        env:
          NAME: ${{ steps.app.outputs.name }}
        run: scripts/smoke-test.sh "dist-app/$NAME.app" dist-app/*-arm64.dmg
      - name: Publish the pre-release
        if: steps.release.outputs.tag != '' && steps.app.outputs.repo != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.app.outputs.repo }}
          NAME: ${{ steps.app.outputs.name }}
          TAG: ${{ steps.release.outputs.tag }}
        # The files go up without spaces in their names (GitHub would turn "The Lodge" into "The.Lodge"), plus a copy
        # with a fixed name, so a download page can always link to releases/latest/download/<Name>-arm64.dmg
        # ("latest" skips pre-releases, so the page keeps offering the last promoted version). The updater only
        # takes the copy named with its version.
        # --target makes the tag on this commit when the run was started with "Release it" (a tag made with this
        # workflow's token doesn't start another run, so it isn't built twice). It only works in this repo.
        run: |
          slug="${NAME// /}" version="${TAG#v}"
          mkdir publish
          cp "dist-app/$NAME-$version-arm64.dmg" "publish/$slug-$version-arm64.dmg"
          cp "dist-app/$NAME-$version-arm64.dmg" "publish/$slug-arm64.dmg"
          (cd publish && shasum -a 256 "$slug-$version-arm64.dmg" >"$slug-$version-arm64.dmg.sha256")
          target=(); [ "$REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
          gh release create "$TAG" publish/* --repo "$REPO" "${target[@]}" \
            --title "$NAME $version" --generate-notes --prerelease
      - name: Give it to everyone
        if: steps.release.outputs.tag != '' && steps.app.outputs.repo != '' && inputs.everyone
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: scripts/promote-beta.sh "$TAG"
      - name: Updates are off
        if: steps.release.outputs.tag != '' && steps.app.outputs.repo == ''
        run: echo "::notice::app.json has no updateRepo, so nothing was published. The build is kept as the mac-app artifact."
